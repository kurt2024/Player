<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kesin Çözüm Medya Oynatıcı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 768px) {
            .player-container {
                height: auto;
                max-height: 85vh;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            }
        }

        /* Tarayıcının kendi yerel kontrollerini aktif ediyoruz ki oynatmama ihtimali kalmasın */
        video {
            width: 100%;
            height: 100%;
            max-height: 85vh;
            object-fit: contain;
            background: #000;
        }

        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .upload-overlay.hidden {
            display: none;
        }

        .upload-overlay h2 {
            font-size: 1.5rem;
            color: #f8fafc;
        }

        .upload-overlay p {
            font-size: 0.95rem;
            color: #94a3b8;
            max-width: 400px;
        }

        .upload-btn {
            background: #3b82f6;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .change-file-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            z-index: 6;
            display: none;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- Dosya Yükleme Ekranı -->
        <div class="upload-overlay" id="uploadOverlay">
            <i class="fa-solid fa-play-circle fa-3x" style="color: #3b82f6;"></i>
            <h2>Medya Oynatıcı</h2>
            <p>Oynatmak istediğiniz video dosyasını seçin.</p>
            <label class="upload-btn">
                <i class="fa-solid fa-folder-open"></i> Video Seç
                <input type="file" id="fileInput" accept="video/*" style="display: none;">
            </label>
        </div>

        <!-- Dosya Değiştir Butonu -->
        <button class="change-file-btn" id="changeFileBtn">
            <i class="fa-solid fa-rotate"></i> Başka Video Seç
        </button>

        <!-- Video Alanı (Tarayıcının yerel kontrolleri ile donatıldı) -->
        <video id="videoPlayer" controls playsinline webkit-playsinline></video>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const fileInput = document.getElementById('fileInput');
        const changeFileBtn = document.getElementById('changeFileBtn');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                video.src = fileURL;
                uploadOverlay.classList.add('hidden');
                changeFileBtn.style.display = 'flex';
                video.play().catch(err => {
                    console.log("Oynatma tetiklendi, kullanıcı etkileşimi gerekebilir:", err);
                });
            }
        });

        changeFileBtn.addEventListener('click', () => {
            fileInput.click();
        });
    </script>
</body>
</html>
